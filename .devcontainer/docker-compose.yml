version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=https://animated-carnival-5wgp79rqjxj3445p-3000.app.github.dev
    ports:
      - "3000:3000"
      - "5000:5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 